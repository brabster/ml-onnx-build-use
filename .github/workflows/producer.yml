name: producer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install producer dependencies
        run: python -m pip install --quiet --upgrade pip && python -m pip install --quiet -r producer/requirements.txt

      - name: Run producer tests
        run: python -m pytest producer/tests

      - name: Package the ONNX models
        run: |
          python producer/train_and_package.py --output-dir producer/dist
          python producer/train_and_package_probability.py --output-dir producer/dist

      - name: Upload packaged model
        uses: actions/upload-artifact@v7
        with:
          name: packaged-onnx-model
          path: producer/dist
