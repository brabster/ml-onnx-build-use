name: python-consumer

on:
  workflow_run:
    workflows: ["producer"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  test-consumer:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packaged model
        uses: actions/download-artifact@v5
        with:
          name: packaged-onnx-model
          path: model-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install Python consumer dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python_consumer/requirements.txt

      - name: Run Python consumer test
        env:
          MODEL_PATH: model-artifact/iris_classifier.onnx
        run: python -m pytest python_consumer/tests
