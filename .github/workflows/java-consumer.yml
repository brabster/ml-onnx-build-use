name: java-consumer

on:
  workflow_run:
    workflows: ["producer"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  test-consumer:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download packaged model
        uses: actions/download-artifact@v5
        with:
          name: packaged-onnx-model
          path: model-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Run Java consumer test
        working-directory: java_consumer
        env:
          MODEL_PATH: ../model-artifact/iris_classifier.onnx
        run: mvn --batch-mode test
