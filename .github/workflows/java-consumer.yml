name: java-consumer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download packaged model
        uses: actions/download-artifact@v8
        with:
          name: packaged-onnx-model
          path: model-artifact

      - name: Run Java consumer test
        working-directory: java_consumer
        env:
          MODEL_PATH: ../model-artifact/iris_classifier.onnx
          SETOSA_MODEL_PATH: ../model-artifact/setosa_probability.onnx
        run: mvn --batch-mode --quiet test
